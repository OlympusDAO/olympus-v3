name: Bootstrap CI environment
description: Standardized repository setup for CI.

inputs:
    install-foundry:
        description: Install foundry toolchain if required by the project.
        required: false
        default: "true"
    install-solidity-dependencies:
        description: |
            Install the Solidity dependencies through the postinstall hook. The hook drives Forge,
            so a job that sets install-foundry to false must set this to false as well. Node
            packages are still installed either way.
        required: false
        default: "true"

runs:
    using: composite
    steps:
        - name: Install pnpm
          uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
          with:
              version: 11.13.0

        - name: Setup Node.js
          uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
          with:
              node-version-file: .nvmrc
              cache: pnpm
              cache-dependency-path: pnpm-lock.yaml

        - name: Install Foundry
          if: ${{ inputs.install-foundry == 'true' }}
          uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
          with:
              version: 1.8.1

        # The postinstall hook resolves the Solidity dependencies and ends with `forge clean`, so it
        # requires Forge and it wipes any build artifacts restored before this action runs. Restore
        # a Foundry cache after Bootstrap, never before it.
        - name: Install dependencies
          if: ${{ inputs.install-solidity-dependencies != 'false' }}
          run: pnpm install --frozen-lockfile
          shell: bash

        - name: Install Node dependencies only
          if: ${{ inputs.install-solidity-dependencies == 'false' }}
          run: pnpm install --frozen-lockfile --ignore-scripts
          shell: bash
