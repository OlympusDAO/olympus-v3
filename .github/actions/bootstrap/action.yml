name: Bootstrap CI environment
description: Standardized repository setup for CI.

inputs:
    install-foundry:
        description: Install foundry toolchain if required by the project.
        required: false
        default: "true"

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
          with:
              node-version-file: .nvmrc

        - name: Install pnpm
          uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
          with:
              version: 11.13.0

        - name: Install Foundry
          if: ${{ inputs.install-foundry == 'true' }}
          uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
          with:
              version: 1.7.1

        - name: Install dependencies
          run: pnpm install --frozen-lockfile
          shell: bash
