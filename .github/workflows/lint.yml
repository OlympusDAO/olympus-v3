name: Lint Check
on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Restore Foundry build cache
              uses: ./.github/actions/foundry-cache

            - name: Run forge lint inline annotations
              uses: 0xJem/forge-lint-inline-action@7f2d23ba91fe2839c0e16034869f4881d3fd2d41 # v0.1.0
              with:
                  install-foundry: false
                  fail-level: error

            - name: Run lint check
              run: pnpm run lint:check
