name: Validate Emergency Config

on:
    push:
        branches:
            - emergency
            - master
            - main
            - develop
        paths:
            - "documentation/emergency/**"
            - "src/scripts/env.json"
            - "shell/validate-emergency-config.js"

    pull_request:
        paths:
            - "documentation/emergency/**"
            - "src/scripts/env.json"
            - "shell/validate-emergency-config.js"

    workflow_dispatch:

jobs:
    validate:
        name: Validate Emergency Config
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1.7.0

            - name: Install dependencies
              # Frozen lockfile policy is enforced in .npmrc.
              run: pnpm install --frozen-lockfile

            - name: Run validation script
              run: node shell/validate-emergency-config.js

            - name: Check for uncommitted changes
              run: |
                  if [[ -n $(git status --porcelain documentation/emergency/) ]]; then
                    echo "ERROR: Uncommitted changes detected in documentation/emergency/"
                    git status --porcelain documentation/emergency/
                    exit 1
                  fi

