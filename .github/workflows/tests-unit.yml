name: Tests - Unit
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    unit-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Build
              run: pnpm run build

            - name: Run unit tests
              run: pnpm run test:unit
