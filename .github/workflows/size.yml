name: Build Size
on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    size-check:
        runs-on: ubuntu-latest
        # Cap a hung job; the GitHub default is six hours.
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            # `forge build` alone does not fail on an oversized contract, `--sizes` does.
            # `pnpm run size` starts with `forge clean`: without it, `forge build --sizes` with the
            # `--skip` filters reports only some of the contracts. So this job builds cold and
            # restores no Foundry cache.
            - name: Contract Size
              run: pnpm run size
