name: Build Size
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    size-check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: pnpm/action-setup@v5

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1

            - name: Install dependencies
              # Frozen lockfile policy is enforced in .npmrc.
              run: pnpm install

            # Build will fail if a contract is over the size limit
            - name: Contract Size
              run: pnpm run size
