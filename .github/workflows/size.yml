name: Build Size
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    size-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            # Build will fail if a contract is over the size limit
            - name: Contract Size
              run: pnpm run size