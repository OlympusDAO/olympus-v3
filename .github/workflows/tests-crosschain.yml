name: Tests - Cross-Chain
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    crosschain-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Build
              run: pnpm run build

            - name: Run cross-chain fork tests
              run: pnpm run test:crosschainfork
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
