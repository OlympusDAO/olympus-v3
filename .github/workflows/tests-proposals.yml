name: Tests - OCG Proposals
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    proposal-tests:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  submodules: recursive

            - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1.7.0

            - name: Install dependencies
              # Frozen lockfile policy is enforced in .npmrc.
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Run proposal simulation tests
              run: pnpm run test:proposal
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
