name: Build
on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Restore and save Foundry build cache
              uses: ./.github/actions/foundry-cache
              with:
                  # Fork pull requests may restore trusted caches but must not publish cache entries.
                  save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

            - name: Build
              run: pnpm run build
