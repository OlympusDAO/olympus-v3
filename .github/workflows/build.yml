name: Build and Tests
on:
    push:
        branches:
            - master
            - develop
    pull_request:

permissions:
    contents: read

# Supersede in-flight pull request runs. Push runs always finish their checks.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Build (Solar)
              run: pnpm run build

    size-check:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            FOUNDRY_PROFILE: deploy

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Check production contract sizes (Solc)
              run: pnpm run size

    gas-snapshots:
        # test:gas needs an RPC secret for its fork suite. GitHub withholds that secret from
        # external forks and Dependabot PRs, so only trusted PRs and branch pushes run this job.
        if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            FOUNDRY_PROFILE: deploy

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Restore and save Solc gas build cache
              uses: ./.github/actions/foundry-cache
              with:
                  save: "true"
                  prefix: foundry-gas-v1
                  artifact-path: out/gas
                  cache-path: cache/gas/*/solidity-files-cache.json
                  scope-file: shell/test_gas_sharded.sh

            - name: Run gas test shards (Solc)
              run: pnpm run test:gas:sharded
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

            - name: Check gas snapshots (Solc)
              run: pnpm run test:gas:check

    permission-lists:
        runs-on: ubuntu-latest
        # Cap a hung job; the GitHub default is six hours.
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Check the generated permission lists (Solar)
              run: pnpm run gen:perms:check

    unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Run unit tests (Solar)
              run: pnpm run test:unit

    invariant-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Run invariant tests (Solar)
              run: pnpm run test:invariant

    # RPC secrets are unavailable to fork and Dependabot pull requests.
    fork-tests:
        name: Fork tests - ${{ matrix.shard.name }}
        if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                shard:
                    - name: Loan Consolidator
                      script: test:fork:loan-consolidator
                    - name: Boosted Liquidity
                      script: test:fork:boosted-liquidity
                    - name: Proposal Helpers
                      script: test:fork:proposal-helpers
                    - name: Misc
                      script: test:fork:misc

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Run fork tests (Solar) - ${{ matrix.shard.name }}
              run: pnpm run ${{ matrix.shard.script }}
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

    proposal-tests:
        if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Run proposal simulation tests (Solar)
              run: pnpm run test:proposal
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

    crosschain-tests:
        if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Run cross-chain fork tests (Solar)
              run: pnpm run test:crosschainfork
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
