name: Tests - Fork
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    fork-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Build
              run: pnpm run build

            - name: Run fork tests
              run: pnpm run test:fork
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
