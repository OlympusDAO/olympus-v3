name: Tests - Fork
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    fork-tests:
        name: Fork tests - ${{ matrix.shard.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard:
                    - name: Loan Consolidator
                      script: test:fork:loan-consolidator
                    - name: Boosted Liquidity
                      script: test:fork:boosted-liquidity
                    - name: Proposal Helpers
                      script: test:fork:proposal-helpers
                    - name: Misc
                      script: test:fork:misc

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Bootstrap
              uses: ./.github/actions/bootstrap

            - name: Build
              run: pnpm run build

            - name: Run fork tests - ${{ matrix.shard.name }}
              run: pnpm run ${{ matrix.shard.script }}
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
