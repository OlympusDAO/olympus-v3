name: Tests - Fork
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    run-ci:
        name: Fork tests - ${{ matrix.shard.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard:
                    - name: Loan Consolidator
                      script: test:fork:loan-consolidator
                    - name: Boosted Liquidity
                      script: test:fork:boosted-liquidity
                    - name: Proposal Helpers
                      script: test:fork:proposal-helpers
                    - name: Misc
                      script: test:fork:misc

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: pnpm/action-setup@v2
              with:
                  version: 9

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: 1.5.1

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Run fork tests - ${{ matrix.shard.name }}
              run: pnpm run ${{ matrix.shard.script }}
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
