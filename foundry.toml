[profile.default]
ffi = true
# Generate the AST only for commands that need it.
ast = false
solc = "solar:0.3.1"
out = "out-solar"
cache_path = "cache-solar"
test_failures_file = "cache-solar/test-failures"
# Forge 1.8.1 defaults to the osaka EVM version. Pin the target that the deployment chains run.
evm_version = "prague"
legacy_assertions = true
assertions_revert = false
fs_permissions = [
    { access = "write", path = "./src/test/sim/out/" },
    { access = "read-write", path = "./deployments/" },
    { access = "read", path = "./src/scripts/" },
    { access = "read", path = "./src/proposals/addresses.json" },
    { access = "read-write", path = "./src/scripts/env.json" },
    { access = "read-write", path = "./src/scripts/lz-bridge-testnet/deployments/" },
]
gas_limit = "18446744073709551615"
# Run each top-level test call as a separate transaction so account and storage access costs match
# production execution. Keeping this explicit also gives Forge 1.7 and 1.8 the same test semantics.
# The multisig profile disables isolation because Safe calls share one transaction.
# The `deploy` profile also produces the gas snapshots, so needs isolation (inherited).
isolate = true

# Release optimizer settings live on the deploy profile.
optimizer = false
verbosity = 2
# Gas snapshots are opt-in through `pnpm run test:gas`.
gas_snapshot_emit = false
snapshots = "out-solar/snapshots"

libs = ["dependencies"]
# Tests live here, not in the default `test` directory. While this pointed at a directory that does
# not exist, Forge replaced the `test/=src/test/` entry of remappings.txt with narrower generated
# ones covering only the subdirectories that happen to exist, so an import from any new subdirectory
# of src/test failed to resolve.
test = "src/test"
# Drops warnings originating in the dependencies from solc output. Post-processing only: it cannot
# restore warnings solc discarded at its own limit of 256 per invocation, which applies separately
# to each compilation job Forge runs.
ignored_warnings_from = ["dependencies", "deprecated"]

[profile.default.fuzz]
runs = 256
failure_persist_dir = "cache-solar/fuzz"

[profile.default.invariant]
# Forge distributes campaigns by suite. Four workers keep a long suite from running serially.
workers = 4
failure_persist_dir = "cache-solar/invariant"

[profile.multisig]
isolate = false
script_execution_protection = false

[profile.deploy]
solc = "0.8.36"
out = "out"
cache_path = "cache"
test_failures_file = "cache/test-failures"
snapshots = "snapshots"
optimizer = true
optimizer_runs = 400
script_execution_protection = false

[profile.deploy.fuzz]
failure_persist_dir = "cache/fuzz"

[profile.deploy.invariant]
failure_persist_dir = "cache/invariant"

# Coverage inherits the Solar compiler and changes only report and test settings.
[profile.coverage]
# The report is the output; test traces are not.
verbosity = 0
# A coverage run must not rewrite the tracked gas snapshots, which are measured under the settings
# of a normal build.
gas_snapshot_emit = false
# Coverage output is long enough without compiler warnings.
ignored_warnings_from = ["dependencies", "src"]

# Coverage needs each line reached once, not a wide search. A `forge-config` comment in a test file
# overrides both of the sections below, and the command line does not override that comment either,
# so suites carrying one keep their own counts.
[profile.coverage.fuzz]
runs = 8

[profile.coverage.invariant]
runs = 1
depth = 15
# Hides the per-selector call table that every invariant suite would otherwise print.
show_metrics = false

[lint]
severity = ["high", "medium", "low", "info", "gas", "code-size"]
exclude_lints = [
    # Prefer auditable Solidity hashing; use assembly only when profiling justifies it.
    "asm-keccak256",
    # Framework module handles and test fixtures intentionally use uppercase identifiers.
    "mixed-case-variable",
    # Preserve framework and external ABI names such as KEYCODE, VERSION, sOHM, and gOHM.
    "mixed-case-function",
    # Events intentionally follow completed external effects. This heuristic cannot recognize
    # reentrancy guards, STATICCALLs, or trusted dependencies and encourages misleading ordering.
    "reentrancy-events",
    # Solidity zero-initializes locals; explicit `= 0` can add gas for little readability gain.
    "uninitialized-local",
    "pragma-inconsistent",
]
# Builds do not print lint diagnostics. `forge lint`, which CI runs, still reports all of them.
lint_on_build = false

[rpc_endpoints]
# Place ALCHEMY_API_KEY in the environment or .env file
mainnet = { endpoint = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
sepolia = { endpoint = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
base = { endpoint = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
base-sepolia = { endpoint = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
arbitrum = { endpoint = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
arbitrum-sepolia = { endpoint = "https://arb-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
optimism = { endpoint = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
optimism-sepolia = { endpoint = "https://opt-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
polygon = { endpoint = "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
polygon-amoy = { endpoint = "https://polygon-amoy.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
berachain = { endpoint = "https://berachain-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
berachain-bepolia = { endpoint = "https://berachain-bepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
robinhood = { endpoint = "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
robinhood-testnet = { endpoint = "https://robinhood-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}", retries = 3, retry_backoff = 10000, compute_units_per_second = 500 }
# Solana is not an EVM chain, so forge cannot fork or call it through this alias; it serves the
# HTTP reads of the tooling only (`vm.rpcUrl("solana")` in CCIPTokenPoolBatch.fundPool and the
# default Solana endpoint of shell/calc_bridged_supply.sh, overridable with SOLANA_RPC_URL).
solana = "https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[etherscan]
# Override Forge's default Blockscout mapping for Robinhood, including trace source lookups.
robinhood = { chain = 4663, key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=4663" }

[soldeer]
remappings_generate = false

