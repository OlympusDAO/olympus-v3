[profile.default]
ffi = true
# Deployment verification and Quabi-based tests require AST artifacts from normal builds.
ast = true
# Pinned so that every machine compiles with the same compiler. Without an explicit version, Forge
# resolves each source file to the newest installed compiler that satisfies its pragma, so a
# developer and CI diverge silently. Forge cannot auto-resolve a release newer than the list built
# into its binary, but an explicitly pinned version is fetched from the live release list on demand.
solc_version = "0.8.36"
# Forge 1.7.1 defaults to the osaka EVM version. Pin the target that the deployment chains run.
evm_version = "prague"
legacy_assertions = true
assertions_revert = false
fs_permissions = [
    { access = "read", path = "./out/" },
    { access = "write", path = "./src/test/sim/out/" },
    { access = "read-write", path = "./deployments/" },
    { access = "read", path = "./src/scripts/" },
    { access = "read", path = "./src/proposals/addresses.json" },
    { access = "read-write", path = "./src/scripts/env.json" },
    { access = "read-write", path = "./src/scripts/lz-bridge-testnet/deployments/" },
]
gas_limit = "18446744073709551615"

optimizer = true
optimizer_runs = 10000
verbosity = 3

# Operator needs special optimizer settings to remain within the bytecode-size limit.
# Restrictions apply to the entire connected import graph, not only to the matching source file.
# A script that imports Operator compiles all contracts in that graph at 10 runs, even when it does
# not deploy Operator. Use IOperator for interactions and a dedicated script to deploy Operator.
# A restriction is never satisfied on its own: Forge picks a profile that meets it, preferring the
# default profile and otherwise the alphabetically first entry below. Removing an entry that a
# restriction relies on fails the build with "Missing profile satisfying settings restrictions".
# A restriction also overrides `--optimizer-runs` on the command line.
additional_compiler_profiles = [{ name = "ten-runs", optimizer_runs = 10 }]
compilation_restrictions = [{ paths = "src/policies/Operator.sol", optimizer_runs = 10 }]
libs = ["dependencies"]
# Tests live here, not in the default `test` directory. While this pointed at a directory that does
# not exist, Forge replaced the `test/=src/test/` entry of remappings.txt with narrower generated
# ones covering only the subdirectories that happen to exist, so an import from any new subdirectory
# of src/test failed to resolve.
test = "src/test"
# Drops warnings originating in the dependencies from solc output. Post-processing only: it cannot
# restore warnings solc discarded at its own limit of 256 per invocation, which applies separately
# to each compilation job Forge runs.
ignored_warnings_from = ["dependencies", "deprecated"]

[profile.deploy]
script_execution_protection = false

[profile.multisig]
script_execution_protection = false

# Used by `forge coverage`, which recompiles from scratch every run and keeps nothing in `out/`.
[profile.coverage]
# The report is the output; test traces are not.
verbosity = 0
# A coverage run must not rewrite the tracked gas snapshots, which are measured under the settings
# of a normal build.
gas_snapshot_emit = false
# Coverage output is long enough without solc warnings.
ignored_warnings_from = ["dependencies", "src"]
# Emptied so that coverage compiles in a single job. The Operator restriction otherwise adds a
# second job carrying the same compiler version, and coverage items of two such jobs are
# misattributed between files.
compilation_restrictions = []

# Coverage needs each line reached once, not a wide search. A `forge-config` comment in a test file
# overrides both of the sections below, and the command line does not override that comment either,
# so suites carrying one keep their own counts.
[profile.coverage.fuzz]
runs = 8

[profile.coverage.invariant]
runs = 1
depth = 15
# Hides the per-selector call table that every invariant suite would otherwise print.
show_metrics = false

[fuzz]
runs = 256

[lint]
exclude_lints = ["asm-keccak256", "mixed-case-variable", "mixed-case-function"]
# Builds do not print lint diagnostics. `forge lint`, which CI runs, still reports all of them.
lint_on_build = false

